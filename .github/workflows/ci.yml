name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install nightly for fmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install solana-keygen
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Format check
        run: cargo +nightly fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked -- -D warnings

      - name: Build
        run: cargo build --locked

      - name: Round-trip test
        run: |
          solana-keygen new -o /tmp/keypair.json --no-bip39-passphrase --force
          PUBKEY=$(solana-keygen pubkey /tmp/keypair.json)
          BASE58=$(cargo run --quiet -- /tmp/keypair.json)
          solana-keygen verify "$PUBKEY" "$BASE58"